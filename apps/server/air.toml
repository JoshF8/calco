# Air — hot reload for Go.
# Install: `go install github.com/air-verse/air@latest`
# Run:     `air` (from apps/server/) or `task server:dev` from the repo root.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "internal/adapters/outbound/db/generated"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_ext = ["go", "yaml", "yml", "toml", "sql"]
  kill_delay = "1s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
