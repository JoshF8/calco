services:
  postgres:
    image: postgres:17-alpine
    container_name: calco-postgres
    environment:
      POSTGRES_USER: calco
      POSTGRES_PASSWORD: calco_dev
      POSTGRES_DB: calco
    ports:
      - "5432:5432"
    volumes:
      - calco-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calco -d calco"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  calco-postgres-data:
