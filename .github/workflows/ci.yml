name: ci

# Cancel in-progress runs when a newer commit on the same ref arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── apps/web — TypeScript / Vite / React ─────────────────────────────────
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package signatures
        run: pnpm audit signatures

      - name: Typecheck
        run: pnpm --filter @calco/web typecheck

      - name: Lint
        run: pnpm --filter @calco/web lint

      - name: Test
        run: pnpm --filter @calco/web test

      - name: Build
        run: pnpm --filter @calco/web build

  # ─── apps/server — Go / Huma / chi ────────────────────────────────────────
  server:
    name: server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: apps/server/go.sum

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o /tmp/calco-server ./cmd/server

  # ─── OpenAPI ↔ generated TS types drift check ─────────────────────────────
  # The web app commits apps/web/src/lib/types.gen.ts (generated from the
  # server's OpenAPI spec). This job boots the server, regenerates the types,
  # and fails if the committed file is stale — guaranteeing the contract and
  # the client types never silently diverge.
  openapi-types:
    name: openapi-types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: apps/server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and start server
        working-directory: apps/server
        run: |
          go build -o /tmp/calco-server ./cmd/server
          /tmp/calco-server &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              echo "server up"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"; exit 1

      - name: Regenerate types from live OpenAPI spec
        run: pnpm --filter @calco/web gen:types

      - name: Fail if generated types drifted
        run: |
          if ! git diff --exit-code -- apps/web/src/lib/types.gen.ts; then
            echo "::error::types.gen.ts is stale. Run 'task web:gen-types' against a running server and commit the result."
            exit 1
          fi

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
