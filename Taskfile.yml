version: '3'

tasks:
  # ─── Top-level orchestration ────────────────────────────────────────────────
  dev:
    desc: Run web and server in parallel
    deps: [wasm:build, web:dev, server:dev]

  build:
    desc: Build web + server + WASM engine
    cmds:
      - task: wasm:build
      - task: web:build
      - task: server:build

  lint:
    desc: Lint web + vet server
    deps: [web:lint, server:vet]

  test:
    desc: Run all tests
    deps: [web:test, server:test]

  # ─── Web (apps/web) ─────────────────────────────────────────────────────────
  web:install:
    desc: Install web dependencies
    dir: apps/web
    cmds:
      - pnpm install

  web:dev:
    desc: Run frontend dev server
    dir: apps/web
    cmds:
      - pnpm dev

  web:build:
    desc: Build frontend for production
    dir: apps/web
    cmds:
      - pnpm build

  web:lint:
    desc: Lint frontend
    dir: apps/web
    cmds:
      - pnpm lint

  web:test:
    desc: Run frontend tests
    dir: apps/web
    cmds:
      - pnpm test

  web:gen-types:
    desc: Generate TS types from running server's OpenAPI spec
    dir: apps/web
    cmds:
      - pnpm gen:types

  # ─── Server (apps/server) ───────────────────────────────────────────────────
  server:dev:
    desc: Run server with hot reload (requires air)
    dir: apps/server
    cmds:
      - air

  server:run:
    desc: Run server once (no hot reload)
    dir: apps/server
    cmds:
      - go run ./cmd/server

  server:build:
    desc: Build server binary
    dir: apps/server
    cmds:
      - mkdir -p ../../bin
      - go build -o ../../bin/calco ./cmd/server

  server:test:
    desc: Run server tests
    dir: apps/server
    cmds:
      - go test ./...

  server:vet:
    desc: Run go vet
    dir: apps/server
    cmds:
      - go vet ./...

  # ─── WASM engine (apps/server → apps/web) ─────────────────────────────────
  # The Go core compiles to a WebAssembly module served as a static asset, so
  # the whole app (import + generate) runs client-side from a static origin —
  # GitHub Pages, no infrastructure. The output files are gitignored build
  # artefacts; regenerate after changing the domain core.

  wasm:build:
    desc: Build the Go core as WASM into apps/web/public
    dir: apps/server
    cmds:
      - GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o ../web/public/calco.wasm ./cmd/wasm
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ../web/public/wasm_exec.js

  # ─── Database ───────────────────────────────────────────────────────────────
  # Default DB is SQLite (file-based, no infra).
  # Set DATABASE_URL to a Postgres URL to use Postgres instead — useful for
  # validating queries against both engines or for the hosted environment.

  db:migrate:
    desc: Apply migrations (SQLite by default; pass DATABASE_URL for Postgres)
    dir: apps/server
    cmds:
      - |
        if [ -n "$DATABASE_URL" ]; then
          goose -dir internal/adapters/outbound/db/migrations postgres "$DATABASE_URL" up
        else
          goose -dir internal/adapters/outbound/db/migrations sqlite3 "./calco.db" up
        fi

  db:reset:
    desc: Drop and recreate the local SQLite database
    dir: apps/server
    cmds:
      - rm -f calco.db
      - task: db:migrate

  db:gen:
    desc: Regenerate sqlc code
    dir: apps/server
    cmds:
      - sqlc generate

  # ─── Convenience ────────────────────────────────────────────────────────────
  clean:
    desc: Remove build artefacts and the local SQLite database
    cmds:
      - rm -rf bin/
      - rm -rf apps/web/dist
      - rm -rf apps/web/node_modules/.vite
      - rm -f apps/server/calco.db
